<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>NC CitiNet — Night City Atlas</title>

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Panneau de contrôle de l'Atlas -->
    <div class="atlas-panel">
        <h1>Night City Atlas — 2045</h1>

        <!-- Navigation -->
        <button id="resetView">Vue d'ensemble</button>

        <!-- Recherche des stations -->
        <label for="rechercheStation">Rechercher une station</label>
        <select id="rechercheStation">
            <option value="">Choisir une station…</option>
        </select>

        <!-- Recherche des districts -->
        <label for="rechercheDistrict">Rechercher un district</label>
        <select id="rechercheDistrict">
            <option value="">Choisir un district…</option>
        </select>

        <!-- Gestion des couches -->
        <label>
            <input type="checkbox" id="toggleStations" checked>
            Stations NCART
        </label>

        <label>
            <input type="checkbox" id="toggleDistricts" checked>
            Zones des districts
        </label>

        <label>
            <input type="checkbox" id="toggleEtiquettesDistricts" checked>
            Noms des districts
        </label>

        <label>
            <input type="checkbox" id="toggleReseau" checked>
            Lignes de transport
        </label>

        <label>
            <input type="checkbox" id="toggleRoutesSecondaires" checked>
            Routes secondaires
        </label>
    </div>

    <!-- Carte interactive -->
    <div id="map"></div>

    <!-- Bibliothèque Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Données cartographiques -->
    <script src="data/positions-etiquettes.js"></script>

    <!-- Fonctionnement de NC CitiNet -->
    <script src="script.js"></script>
</body>

</html>
