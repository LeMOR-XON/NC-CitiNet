
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>NC CitiNet — Night City Atlas</title>

    <!-- Apparence de Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Notre propre CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Night City Atlas — 2045</h1>


<div class="atlas-panel">

    <h1>Night City Atlas — 2045</h1>

    <button id="resetView">Vue d'ensemble</button>


<label for="rechercheStation">Rechercher une station</label>

<select id="rechercheStation">
    <option value="">Choisir une station NCART…</option>
</select>

<label for="rechercheDistrict">Rechercher un district</label>

<select id="rechercheDistrict">
    <option value="">Choisir un district…</option>
</select>

    <label>
        <input type="checkbox" id="toggleStations" checked>
        Stations NCART
    </label>

    <label>
        <input type="checkbox" id="toggleDistricts" checked>
        Districts
    </label>

</div>


    <!-- Emplacement de notre carte -->
    <div id="map"></div>

    <!-- Chargement de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Notre propre JavaScript -->
<!-- Notre propre JavaScript -->
<script src="script.js"></script>
</body>

</html>
